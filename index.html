<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="一款离线可用、数据保存在本地的个人日常事项安排应用。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>日序 · 我的日常安排</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">日</div>
          <div><strong>日序</strong><span>把日子过得清楚一点</span></div>
        </div>
        <nav>
          <button class="nav-item active" data-view="today"><span>◉</span>今天</button>
          <button class="nav-item" data-view="week"><span>▦</span>近 7 天</button>
          <button class="nav-item" data-view="all"><span>≡</span>全部事项</button>
        </nav>
        <div class="sidebar-section">
          <p>分类</p>
          <button class="category-filter" data-category="工作"><i class="dot work"></i>工作</button>
          <button class="category-filter" data-category="生活"><i class="dot life"></i>生活</button>
          <button class="category-filter" data-category="健康"><i class="dot health"></i>健康</button>
          <button class="category-filter" data-category="学习"><i class="dot study"></i>学习</button>
        </div>
        <div class="sidebar-bottom">
          <button id="installBtn" class="install-btn" hidden>安装到本机</button>
          <button id="exportBtn" class="text-btn">导出备份</button>
          <label class="text-btn import-label">导入备份<input id="importInput" type="file" accept=".json" hidden /></label>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <button id="menuBtn" class="icon-btn menu-btn" aria-label="打开菜单">☰</button>
          <div>
            <p id="eyebrow" class="eyebrow"></p>
            <h1 id="viewTitle">今天</h1>
          </div>
          <div class="top-actions">
            <button id="themeBtn" class="icon-btn" aria-label="切换深浅色">☾</button>
            <button id="calendarBtn" class="calendar-btn" aria-label="打开月历"><span>▦</span><b>月历</b></button>
            <button id="addBtn" class="primary-btn"><span>＋</span> 新事项</button>
          </div>
        </header>

        <section class="summary-grid">
          <article class="summary-card accent">
            <span>今日进度</span>
            <strong id="progressText">0%</strong>
            <div class="progress"><i id="progressBar"></i></div>
          </article>
          <article class="summary-card"><span>待完成</span><strong id="pendingCount">0</strong><small>件事项</small></article>
          <article class="summary-card"><span>已完成</span><strong id="doneCount">0</strong><small>保持节奏</small></article>
        </section>

        <section class="date-strip" id="dateStrip"></section>

        <section class="content-card">
          <div class="content-heading">
            <div><h2 id="listTitle">今日事项</h2><p id="listSubtitle">从一件小事开始</p></div>
            <select id="sortSelect" aria-label="排序方式">
              <option value="time">按时间</option>
              <option value="priority">按优先级</option>
            </select>
          </div>
          <div id="taskList" class="task-list"></div>
          <div id="emptyState" class="empty-state" hidden>
            <div>✓</div><h3>这里很清爽</h3><p>还没有事项，给今天安排一点期待吧。</p>
            <button class="secondary-btn" id="emptyAddBtn">添加第一件事</button>
          </div>
        </section>
      </main>
    </div>

    <dialog id="taskDialog">
      <form id="taskForm" method="dialog">
        <div class="dialog-head"><div><p class="eyebrow">安排一下</p><h2 id="dialogTitle">新建事项</h2></div><button type="button" class="icon-btn" id="closeDialog">×</button></div>
        <input id="taskId" type="hidden" />
        <label>事项名称<input id="taskTitle" required maxlength="80" placeholder="例如：阅读 30 分钟" /></label>
        <div class="form-row">
          <label>日期<input id="taskDate" type="date" required /></label>
          <label>时间<input id="taskTime" type="time" /></label>
        </div>
        <div class="form-row">
          <label>分类<select id="taskCategory"><option>工作</option><option>生活</option><option>健康</option><option>学习</option></select></label>
          <label>优先级<select id="taskPriority"><option value="medium">普通</option><option value="high">重要</option><option value="low">稍后</option></select></label>
        </div>
        <label>备注<textarea id="taskNotes" rows="3" maxlength="300" placeholder="补充一点细节（可选）"></textarea></label>
        <div class="dialog-actions"><button type="button" id="deleteBtn" class="danger-btn" hidden>删除</button><span></span><button type="button" id="cancelBtn" class="secondary-btn">取消</button><button type="submit" class="primary-btn">保存事项</button></div>
      </form>
    </dialog>
    <dialog id="calendarDialog" class="calendar-dialog">
      <div class="calendar-panel">
        <div class="calendar-head">
          <button id="prevMonthBtn" class="icon-btn" aria-label="上个月">‹</button>
          <div><p class="eyebrow">选择日期</p><h2 id="calendarMonthTitle"></h2></div>
          <button id="nextMonthBtn" class="icon-btn" aria-label="下个月">›</button>
          <button id="closeCalendarBtn" class="icon-btn calendar-close" aria-label="关闭">×</button>
        </div>
        <div class="calendar-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="calendarGrid" class="calendar-grid"></div>
        <div class="calendar-footer">
          <button id="calendarTodayBtn" class="secondary-btn">回到今天</button>
          <p><i></i> 圆点表示当天已有事项</p>
        </div>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
